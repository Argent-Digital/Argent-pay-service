services:
  argent-pay-service:
    build: .
    ports:
      - "8001:8000"
    volumes:
      - .:/app
    restart: always

    command: >
      sh -c "export PYTHONPATH=/app && python -m src.main" 

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"